# Dry run of the D.6 data migration: a Plone 6.1 instance with its own
# database, so the development site is not touched and the import can be
# started again from an empty database.
#   rm -rf var/filestorage/import.fs* var/blobstorage-import
# See MIGRATION_DATA.md.
[buildout]
extends =
    communes-dev.cfg

parts +=
    instance-import
    instance-dryrun

[import]
# the rsync copy of the 4.3 production instance
prod-var = ${buildout:directory}/var/demo_db/data
export-dir = ${buildout:directory}/var/export

[instance-import]
<= instance1
http-address = ${port:instance5-http}
zeo-client = false
file-storage = ${buildout:directory}/var/filestorage/import.fs
blob-storage = ${buildout:directory}/var/blobstorage-import
debug-mode = on
verbose-security = on
zope-conf-additional =

event-log-custom =
    <logfile>
        path ${buildout:directory}/var/log/instance-import.log
        level INFO
    </logfile>

environment-vars =
    zope_i18n_compile_mo_files true
    OO_PORT ${port:oo-port}
    PYTHON_UNO ${port:python-uno}
    PUBLIC_URL http://localhost:${port:instance5-http}/Plone
    RETURN_FULLOBJECT_AFTER_CREATION_DEFAULT False
    SSO_APPS_URL ${port:sso-apps-url}
    SSO_APPS_CLIENT_ID ${port:sso-apps-client-id}
    SSO_APPS_CLIENT_SECRET ${port:sso-apps-client-secret}
    SSO_APPS_USER_USERNAME ${port:sso-apps-user-username}
    SSO_APPS_USER_PASSWORD ${port:sso-apps-user-password}
    VISION_API_URL ${port:vision-api-url}
    COLLECTIVE_EXPORTIMPORT_BLOB_HOME ${import:prod-var}/blobstorage-demo
    COLLECTIVE_EXPORTIMPORT_CENTRAL_DIRECTORY ${import:export-dir}

# A finished dry run, kept aside so it stays browsable while
# instance-import builds the next one:
#   cp var/filestorage/import.fs var/filestorage/dryrun.fs
#   cp -a var/blobstorage-import var/blobstorage-dryrun
[instance-dryrun]
<= instance-import
http-address = ${port:instance6-http}
file-storage = ${buildout:directory}/var/filestorage/dryrun.fs
blob-storage = ${buildout:directory}/var/blobstorage-dryrun
event-log-custom =
    <logfile>
        path ${buildout:directory}/var/log/instance-dryrun.log
        level INFO
    </logfile>
